name: Secure CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  security-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      ##################################################
      # SAST - Semgrep
      ##################################################
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1

      ##################################################
      # Secret Scan
      ##################################################
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      ##################################################
      # Login to GHCR
      ##################################################
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ##################################################
      # Build Image
      ##################################################
      - name: Build Docker Image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/ledger-api:latest
          docker build -t $IMAGE ./app

      ##################################################
      # Trivy Image Scan
      ##################################################
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ledger-api:latest
          format: table
          exit-code: '0'

      ##################################################
      # Push Image
      ##################################################
      - name: Push Image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/ledger-api:latest
          docker push $IMAGE

      ##################################################
      # Install Cosign
      ##################################################
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      ##################################################
      # Sign Image (Keyless)
      ##################################################
      - name: Sign Image
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/ledger-api:latest

      ##################################################
      # Generate Provenance
      ##################################################
      - name: Generate Provenance
        run: |
          cosign attest \
            --yes \
            --predicate <(echo '{}') \
            --type slsaprovenance \
            ghcr.io/${{ github.repository_owner }}/ledger-api:latest