apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: payments
  labels:
    app: ledger-api

spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: ledger-api

  template:
    metadata:
      labels:
        app: ledger-api
        rollout: stable

    spec:
      serviceAccountName: ledger-api-sa

      containers:
        - name: ledger-api
          image: ghcr.io/tulasikumar4449/ledger-api:latest
          imagePullPolicy: Always
          env:
            - name: ROLLOUT_LABEL
              value: stable

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
                
            seccompProfile:
                type: RuntimeDefault

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          env:
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: STRIPE_API_KEY

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: DB_PASSWORD

            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: APP_NAME

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: LOG_LEVEL

            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ledger-config
                  key: ENVIRONMENT

          ports:
            - containerPort: 8080